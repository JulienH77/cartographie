<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================
     LIGHTBOX 
     ========================================================== */
  #lightbox img {
    cursor: pointer;
  }
  
  /* ==========================================================
     PORTFOLIO MASONRY (STYLE PINTEREST / DRIBBLE)
     ========================================================== */
  main.gallery-masonry {
    column-count: 3;
    column-gap: 1.5rem;
    padding: 2rem;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* Responsive : 2 colonnes sur tablette, 1 sur téléphone */
  @media (max-width: 1100px) {
    main.gallery-masonry { column-count: 2; }
  }
  @media (max-width: 700px) {
    main.gallery-masonry { 
      column-count: 1; 
      padding: 1rem;
    }
  }

  .portfolio-item {
    break-inside: avoid;
    margin-bottom: 1.5rem;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #1a1e23;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  .portfolio-item img, 
  .portfolio-item video,
  .portfolio-item iframe {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .portfolio-item:hover img {
    transform: scale(1.04);
  }

  .portfolio-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(15, 20, 25, 0.95) 0%, rgba(15, 20, 25, 0.6) 50%, transparent 100%);
    opacity: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2rem 1.5rem;
    color: #eef1f4;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .portfolio-overlay-content {
    transform: translateY(20px);
    transition: transform 0.4s ease;
  }

  .portfolio-item:hover .portfolio-overlay {
    opacity: 1;
  }
  .portfolio-item:hover .portfolio-overlay-content {
    transform: translateY(0);
  }

  .portfolio-overlay h2 {
    font-size: 1.3rem;
    margin: 0 0 0.5rem 0;
    font-family: 'Poppins', sans-serif;
    letter-spacing: 0.03em;
    color: #e8c26a;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .portfolio-overlay p {
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 0 0 0.5rem 0;
    color: #cbd5e1;
  }

  .portfolio-item.interactive-card {
    padding: 1.5rem;
    background: #14181c;
  }
  .portfolio-item.interactive-card:hover img {
    transform: none;
  }
  
  /* ==========================================================
     MODALE PLEIN ÉCRAN POUR L'AGAMOGRAPHE
     ========================================================== */
  #agamo-modal {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.95);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  #agamo-modal.is-visible {
    display: flex;
    opacity: 1;
  }

  .agamo-modal-content {
    width: 100%;
    max-width: 1200px;
    padding: 2rem;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .close-agamo-btn {
    position: absolute;
    top: -2rem;
    right: 2rem;
    background: none;
    border: none;
    color: #eef1f4;
    font-size: 3rem;
    cursor: pointer;
    transition: color 0.2s;
    z-index: 2010;
  }

  .close-agamo-btn:hover {
    color: #e8c26a;
  }

  /* ==========================================================
     STYLES 3D SPECIFIQUES A L'AGAMOGRAPHE (AJOUTS IMPORTANTS)
     ========================================================== */
  .agamo-wrapper {
    position: relative;
    width: 100%;
    height: 60vh; /* Ajuste la hauteur si besoin */
    min-height: 400px;
    margin: 2rem auto;
    perspective: 1200px; /* INDISPENSABLE POUR LA 3D */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: grab;
  }

  .agamo-wrapper.is-dragging {
    cursor: grabbing;
  }

  .agamo-scene {
    position: relative;
    transform-style: preserve-3d; /* INDISPENSABLE POUR LA 3D */
    transform-origin: center center;
  }

  .agamo-band {
    position: absolute;
    top: 0;
    left: 0;
    backface-visibility: hidden;
    box-shadow: inset -5px 0 15px rgba(0,0,0,0.25); /* Ombre légère dans le pli */
  }

  .agamo-controls {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
  }

  .agamo-btn {
    background: transparent;
    color: #eef1f4;
    border: 1px solid #e8c26a;
    padding: 0.5rem 1.5rem;
    border-radius: 30px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    transition: all 0.3s ease;
  }

  .agamo-btn:hover, .agamo-btn.is-active {
    background: #e8c26a;
    color: #1a1e23;
  }

  .agamo-loading {
    position: absolute;
    color: #e8c26a;
    font-size: 1.2rem;
    font-weight: bold;
    font-family: 'Poppins', sans-serif;
  }

  .agamo-loading.is-hidden {
    display: none;
  }
</style>
</head>

const container = document.getElementById('map-container');

            ${item.prodKey ? `<p data-i18n="${item.prodKey}"></p>` : ''}
          </div>
        </div>
      `;
      let mediaHTML = `<img src="${v.thumb}" data-full="${v.full}" alt="${v.alt}" loading="lazy" class="trigger-lightbox">`;
      article.innerHTML = mediaHTML + textHTML;
      container.appendChild(article);
    });
    return;
  }

    mediaHTML = `<img src="${item.thumb}" data-full="${item.full}" alt="${item.alt}" loading="lazy" class="trigger-lightbox">`;

    mediaHTML = `<video autoplay loop muted playsinline><source src="${item.src}" type="video/webm"/></video>`;
  } else if (item.type === 'iframe') {
    mediaHTML = `<iframe src="${item.embedUrl}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="aspect-ratio:16/9; pointer-events: auto;"></iframe>`;

// GESTION DE LA LIGHTBOX CLASSIQUE
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('trigger-lightbox') && e.target.dataset.full) {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    lightbox.style.display = 'flex';
    lightboxImg.src = e.target.dataset.full;
    lightbox.setAttribute('aria-hidden', 'false');
  }
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

// Fermeture de la lightbox si on clique à côté de l'image
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) {
    lightbox.style.display = 'none';
    lightboxImg.src = '';
    lightbox.setAttribute('aria-hidden', 'true');
  }
});

// OUVERTURE DANS UN AUTRE ONGLET AU CLIC SUR L'IMAGE EN GRAND
lightboxImg.addEventListener('click', (e) => {
  e.stopPropagation(); // Évite de déclencher la fermeture du conteneur parent
  if (lightboxImg.src) {
    window.open(lightboxImg.src, '_blank');
  }
});

  item.addEventListener('click', () => {
    const selectedLang = item.dataset.lang;
    if(typeof setLang === 'function') setLang(selectedLang);
    langSwitch.classList.remove('open');
  });
});

// ==========================================================
// GESTION DE L'AGAMOGRAPHE (INITIALISATION + EVENTS)
// ==========================================================
let agamoInitialized = false;

document.getElementById('open-agamo-btn').addEventListener('click', () => {
  const modal = document.getElementById('agamo-modal');
  modal.classList.add('is-visible');
  
  if (!agamoInitialized) {
    initAgamograph();
    agamoInitialized = true;
  }
});

document.getElementById('close-agamo').addEventListener('click', () => {
  document.getElementById('agamo-modal').classList.remove('is-visible');
});

function initAgamograph() {
  const TOTAL_BANDS = 28;
  const CONTENT_START = 1;
  const CONTENT_END = TOTAL_BANDS - 1;
  const N = CONTENT_END - CONTENT_START;
  const FIRST_BAND_IS_NATURE = true;

  const FOLD_ANGLE = 38;
  const REVEAL_ANGLE = 52;
  const BW = 42;

  // 👉 C'EST ICI QUE TU PEUX COLLER TA CHAINE BASE 64 SI TU LE SOUHAITES
  const imageUrl = "maps/QGIS/CHAUMONT_agamographe.jpeg"; 

  const wrapper = document.getElementById("agamo-wrapper");
  const scene = document.getElementById("ag3d");
  const loadingEl = document.getElementById("agamo-loading");
  const btnLeft = document.getElementById("agamo-left");
  const btnCenter = document.getElementById("agamo-center");
  const btnRight = document.getElementById("agamo-right");

  let rotation = 0, fitScale = 1, sceneWidth = 0;
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function applyTransform(withTransition) {
    scene.style.transition = withTransition ? "transform .7s cubic-bezier(.22,.85,.34,1)" : "none";
    scene.style.transform = `scale(${fitScale}) rotateY(${rotation}deg)`;
  }
  
  function setActiveButton(btn) {
    [btnLeft, btnCenter, btnRight].forEach(b => b.classList.toggle("is-active", b === btn));
  }
  
  function fitToContainer() {
    if (!sceneWidth) return;
    const available = wrapper.clientWidth - 32;
    fitScale = Math.min(1, available / sceneWidth);
    applyTransform(false);
  }

  function build(naturalWidth, naturalHeight) {
    const bandWidthSource = naturalWidth / TOTAL_BANDS;
    const s = BW / bandWidthSource;
    const sceneHeight = naturalHeight * s;
    const rad = FOLD_ANGLE * Math.PI / 180;
    const cosA = Math.cos(rad);
    const sinA = Math.sin(rad);

    let cumX = 0, cumZ = 0;
    const frag = document.createDocumentFragment();

    for (let k = 0; k < N; k++) {
      const isNature = FIRST_BAND_IS_NATURE ? (k % 2 === 0) : (k % 2 === 1);
      const sign = isNature ? 1 : -1;
      const angle = sign * FOLD_ANGLE;

      const band = document.createElement("div");
      band.className = "agamo-band " + (isNature ? "theme-nature" : "theme-anthro");
      band.style.width = BW + "px";
      band.style.height = sceneHeight + "px";
      band.style.transformOrigin = "left center";
      band.style.transform = `translate3d(${cumX}px,0,${cumZ}px) rotateY(${angle}deg)`;
      band.style.backgroundImage = `url("${imageUrl}")`;
      band.style.backgroundSize = `${TOTAL_BANDS * BW}px ${sceneHeight}px`;

      const sourceIndex = CONTENT_START + k;
      band.style.backgroundPosition = `-${sourceIndex * BW}px 0px`;
      frag.appendChild(band);

      cumX += BW * cosA;
      cumZ += -sign * BW * sinA;
    }

    sceneWidth = cumX;
    scene.style.width = sceneWidth + "px";
    scene.style.height = sceneHeight + "px";
    scene.appendChild(frag);
    scene.classList.add("is-ready");
    loadingEl.classList.add("is-hidden");

    fitToContainer();
    applyTransform(true);
  }

  const preload = new Image();
  preload.onload = () => build(preload.naturalWidth, preload.naturalHeight);
  preload.src = imageUrl;

  window.addEventListener("resize", fitToContainer);

  btnLeft.addEventListener("click", () => { rotation = -REVEAL_ANGLE; applyTransform(true); setActiveButton(btnLeft); });
  btnCenter.addEventListener("click", () => { rotation = 0; applyTransform(true); setActiveButton(btnCenter); });
  btnRight.addEventListener("click", () => { rotation = REVEAL_ANGLE; applyTransform(true); setActiveButton(btnRight); });

  let dragging = false, startX = 0, startRotation = 0, lastX = 0, lastT = 0, velocity = 0;
  
  wrapper.addEventListener("pointerdown", e => {
    dragging = true; startX = lastX = e.clientX; startRotation = rotation;
    lastT = performance.now(); velocity = 0;
    wrapper.classList.add("is-dragging");
    wrapper.setPointerCapture(e.pointerId);
    scene.style.transition = "none";
  });
  
  wrapper.addEventListener("pointermove", e => {
    if (!dragging) return;
    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    velocity = ((e.clientX - lastX) / dt) * 16;
    rotation = clamp(startRotation + (e.clientX - startX) * 0.35, -REVEAL_ANGLE - 25, REVEAL_ANGLE + 25);
    applyTransform(false);
    lastX = e.clientX; lastT = now;
    setActiveButton(null);
  });
  
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    wrapper.classList.remove("is-dragging");
    let v = velocity * 0.35;
    (function step() {
      if (Math.abs(v) < 0.05) return;
      rotation = clamp(rotation + v, -REVEAL_ANGLE - 25, REVEAL_ANGLE + 25);
      v *= 0.92;
      applyTransform(false);
      requestAnimationFrame(step);
    })();
  }
  
  wrapper.addEventListener("pointerup", endDrag);
  wrapper.addEventListener("pointercancel", endDrag);
}
</script>
